<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starred Repositories</title>
  <!-- 引入 Google Fonts 提升字体质感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --tag-bg: #f1f5f9;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* 顶部 Hero 区域 */
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      padding: 60px 20px;
      text-align: center;
      margin-bottom: -40px;
    }

    .header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    /* 主容器 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 搜索栏悬浮组件 */
    .search-wrapper {
      position: sticky;
      top: 20px;
      z-index: 50;
      margin-bottom: 30px;
    }

    .search-box {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      box-shadow: var(--shadow-lg);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15), var(--shadow-lg);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* 网格卡片布局（无语言分组） */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      list-style: none;
    }

    /* 仓库卡片 */
    .repo-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .repo-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .repo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .repo-link {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      word-break: break-word;
      transition: color 0.15s ease;
    }

    .repo-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .repo-description {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    /* 底部元数据（语言 & Star 数） */
    .repo-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .repo-tag {
      background-color: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .repo-stars {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 加载与状态提示 */
    .status-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* 响应式调整 */
    @media (max-width: 640px) {
      .header {
        padding: 40px 15px;
      }
      .header h1 {
        font-size: 1.75rem;
      }
      .repo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- 头部介绍 -->
  <header class="header">
    <h1>五月七日 小羽</h1>
    <p>GitHub收藏列表</p>
  </header>

  <!-- 内容主体 -->
  <main class="container">
    
    <!-- 搜索栏 -->
    <div class="search-wrapper">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜索仓库名称、描述或语言..." 
          oninput="filterRepositories()" 
          autocomplete="off"
        >
      </div>
    </div>

    <!-- 容器与状态提示 -->
    <div id="statusMessage" class="status-message">正在加载数据...</div>
    <ul id="repoGrid" class="repo-grid" style="display: none;"></ul>

  </main>

  <script>
    let allRepos = [];

    // 页面加载完成后自动请求 api.json
    document.addEventListener('DOMContentLoaded', () => {
      fetch('./api.json')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          allRepos = data;
          document.getElementById('statusMessage').style.display = 'none';
          document.getElementById('repoGrid').style.display = 'grid';
          renderRepositories(allRepos);
        })
        .catch(error => {
          console.error('加载 api.json 失败:', error);
          document.getElementById('statusMessage').textContent = '数据加载失败，请检查 api.json 是否存在。';
        });
    });

    // 渲染卡片
    function renderRepositories(repos) {
      const grid = document.getElementById('repoGrid');
      const statusMessage = document.getElementById('statusMessage');

      grid.innerHTML = '';

      if (repos.length === 0) {
        statusMessage.textContent = '未找到匹配的开源项目';
        statusMessage.style.display = 'block';
        grid.style.display = 'none';
        return;
      }

      statusMessage.style.display = 'none';
      grid.style.display = 'grid';

      repos.forEach(repo => {
        const card = document.createElement('li');
        card.className = 'repo-card';

        const name = repo.name || 'Untitled';
        const url = repo.htmlUrl || '#';
        const desc = repo.description || '暂无描述';
        const lang = repo.language || 'Unknown';
        const stars = repo.stargazersCount !== undefined ? repo.stargazersCount : null;

        card.innerHTML = `
          <div>
            <div class="repo-header">
              <a class="repo-link" href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>
            </div>
            <p class="repo-description" title="${desc}">${desc}</p>
          </div>
          <div class="repo-meta">
            <span class="repo-tag">${lang}</span>
            ${stars !== null ? `<span class="repo-stars">★ ${stars}</span>` : ''}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // 前端实时过滤逻辑
    function filterRepositories() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

      if (!keyword) {
        renderRepositories(allRepos);
        return;
      }

      const filtered = allRepos.filter(repo => {
        const name = (repo.name || '').toLowerCase();
        const desc = (repo.description || '').toLowerCase();
        const lang = (repo.language || '').toLowerCase();

        return name.includes(keyword) || desc.includes(keyword) || lang.includes(keyword);
      });

      renderRepositories(filtered);
    }
  </script>

</body>
</html>
